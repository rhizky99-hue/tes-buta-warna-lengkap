name: tes_buta_warna
description: "Tes Buta Warna Lengkap - Created By Rhizky Putra. Aplikasi Skrining Oftalmologi Medis Lengkap."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  tutorial_coach_mark: ^1.3.4
  animations: ^2.2.0
  flutter_native_splash: ^2.4.8
  unity_ads_plugin: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_native_splash:
  color: "#090D16"
  color_dark: "#090D16"
  android_12:
    color: "#090D16"
    color_dark: "#090D16"
  web: true
